# Step one of the kit cycle, and nothing else: pick, then place, at one station.
#
# The base never moves. This mission exists to prove exactly one thing --
# **that the orchestrator can switch from one policy to the next without
# disturbing the arms** -- because everything else in the cycle is that same
# switch repeated.
#
# The shape:
#
#   arms at rest, where every pick episode starts  ->  the pick policy picks the
#   object and holds it  ->  the place policy starts FROM THERE, hands over to
#   the right arm, presents it to the scanner and puts it in the box.
#
# **THE ORCHESTRATOR COMMANDS NOTHING WHILE THE TASK IS RUNNING.** No arm hold
# (hold_arms_between_policies is false), no base. Through the pick, the switch
# and the place, every joint that moves is moved by a policy.
#
# The one exception is the LAST step, a park ramp back to rest -- and it is off
# by default (enable_park is false). It exists because the policy cannot do it:
# see the note on that step.
#
# **There is deliberately nothing between the two policies.** No park, no
# check_arms, no wait. The place policy's first observation has to be the pick
# policy's last pose, because that is how the episodes were recorded. Anything
# inserted here changes the pose the place starts from.
#
# What holds the arms during the switch: nothing, deliberately.
# forward_position_controller latches its last command, so the arms should keep
# holding the pick pose on their own through the few seconds the next client
# takes to start. THAT IS THE THING THIS RUN IS TESTING. If they sag or drop
# the object instead, set hold_arms_between_policies: true and the orchestrator
# will republish the last commanded pose at 30 Hz through the gap
# (cerebel_orchestrator/arm_hold.py) -- but see the sag first.
#
# What must NOT happen during the switch: re-initialising the forward position
# controller. That resets the arm, and a reset arm has dropped the object. Leave
# `policy_prepare_cmd` empty -- bring the controller up once, before the
# mission, and let the orchestrator cycle only the inference client.
#
# EVERY NUMBER IN THIS FILE IS MEASURED, not guessed. The two prompts are
# verbatim from meta/tasks.jsonl of 20260923_pick_and_scan_and_place_01; the
# timeouts are p95 episode duration doubled; the grasp thresholds in
# params/orchestrator.yaml sit in the measured gap between a closed gripper
# (0.006..0.019 m) and an open one (0.045..0.050 m).
#
# The one thing still unverified is `checkpoint_label` below, which is a log
# label only and changes no behaviour.

name: pick_then_place
frame_id: odom

# External sensors that a phase can end on. Everything else the orchestrator
# checks is proprioception -- it reads /joint_states, so it can only answer
# questions about the robot. These answer questions about the world.
#
# THE SCANNER IS THE BEST COMPLETION SIGNAL IN THIS CELL and it is already
# there. A barcode read is an unambiguous physical fact: the object was in the
# right hand, presented the right way, and identified. No joint angle can tell
# you that. Uncomment it below once you know what the scanner publishes -- if
# it is a USB keyboard-wedge device rather than a ROS node, a ten-line node
# that reads it and publishes std_msgs/String is all that stands in the way.
#
# `mode: event` latches: a scan is instantaneous and the verdict only looks at
# 10 Hz, so without latching it would be missed. The code itself is kept and
# printed in the phase's reason, so a run log says WHICH item was scanned.
#
# signals:
#   scanned:
#     topic: /barcode/code        # <-- whatever the scanner actually publishes
#     type: string                # any non-empty value is a read
#     mode: event

policies:
  pick_lipstick:
    task_description: "pick up the lipstick"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"   # <- label only; set it to the real checkpoint name
    params: &policy_params
      # THE VALIDATED RTC CONFIGURATION, sized from the 15-run scan_40_chunk
      # latency set in adibot_gr00t_client docs/VALIDATION.md (round trip p50
      # 239 ms / p95 273 / p99 343; in-flight skip p99 9 steps). Chunk length H
      # is 40, and the invariants are frozen <= overlap <= prefetch_lead and
      # execution_horizon <= H - overlap.
      #
      # THE EARLIER SETTINGS HERE WERE THE WORST CASE FOR SMOOTHNESS. With
      # prefetch on and RTC off, their own A/B measured the seam at 72.1 mrad
      # against 47.7 for blocking -- prefetch removes the PAUSE and worsens the
      # JUMP, because each chunk is planned from scratch and disagrees with the
      # one before it at their shared instants. And execution_horizon 16 re-plans
      # every 0.53 s instead of 0.87 s, so there were more seams as well. Roughly
      # two 4-degree snaps a second, which is what jitter looks like.
      #
      # RTC is what removes the jump: the new chunk is grown out of the old
      # one's tail, and the first rtc_frozen_steps are held identical to it.
      execution_horizon: 26
      prefetch_enable: true
      rtc_enable: true
      prefetch_lead: 16
      rtc_overlap_steps: 14
      rtc_frozen_steps: 10
      rtc_ramp_rate: 5.0
      #
      # NEEDS THE SERVER PATCH. Without server/gr00t_policy.py v3 on the GPU box
      # RTC is silently inert and the client says so at startup -- check the
      # banner. And watch rtc_frozen_overrun in the run sidecar: the D run saw
      # warnings there, because frozen 10 had only a one-step margin over the
      # measured p99 skip of 9. If it climbs, go to frozen 12 / overlap 16 /
      # prefetch_lead 18, which is the doc's own next step.
      enable_limits: false
      enable_right_arm: true
      enable_right_gripper: true

  place_and_scan:
    task_description: "scan and place the object"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"   # <- label only; set it to the real checkpoint name
    params: *policy_params

steps:
  # No park at the START. The pick episodes all begin from the arms' rest pose,
  # which is where they already are, so there is nothing to do -- and it keeps
  # the orchestrator out of the way of the thing being tested.
  #
  # Add `- {step: park_arms, profile: home}` here if you want the arms placed
  # repeatably before each run rather than left wherever the last one ended.

  # HOW THIS PHASE ENDS: the object is held AND the arm has lifted it clear.
  #
  #   grasp: closed   the left finger is below 0.025 m -- it closed on something
  #   envelope: carry every constrained joint is inside the pose a real pick
  #                   ENDS in, measured as p2..p98 of the final frame of all
  #                   152 pick episodes
  #
  # ANDed, so both must hold at the same time, for 0.5 s.
  #
  # Why the gripper alone is not enough: replayed against all 152 pick
  # episodes, `grasp: closed` fires in every one -- but at 44% of a lipstick
  # episode and 69% of an oil or tissue one. The gripper closes while the arm
  # is still down in the tote; the lift and retract are the whole second half.
  # Ending there would hand the place policy an arm halfway through a pick.
  #
  # Why `settled` is not the answer either: median 70%, because the arm pauses
  # for a moment during the lift and that reads as stopped.
  #
  # The pose is what actually distinguishes a finished pick, and it needs no
  # arming rule -- an envelope taken from where the phase ENDS does not contain
  # the pose it starts from. Replayed with both conditions: fires in 151 of 152
  # episodes, at median 88% of the episode.
  #
  # The 30 s timeout is a backstop, not the intended end. Hitting it is a
  # FAILURE, and the reason names which joint was out of envelope.
  - step: run_policy
    policy: pick_lipstick
    until: {timeout_s: 30.0, grasp: closed, side: left, envelope: carry, hold_s: 0.5}
    on_fail: abort

  # >>> the switch <<<
  #
  # Nothing here. The arm is up, holding the object, and that is the place
  # policy's starting observation.

  # The place ends when the RIGHT gripper opens and the arms settle. It can only
  # open after it has closed, during the handover -- the monitor's arming rule
  # is what makes that work, and it is why this condition cannot fire on the
  # pose the phase starts in.
  #
  # `settled` is doing real work here too: the right gripper may open
  # transiently while the object is presented to the scanner, and an arm still
  # moving is not a finished place.
  # MEASURED, 150 place episodes: p95 duration 26.4 s -> 55 s cap.
  #
  # `settled` HERE IS A POSITION SPREAD, NOT A SPEED, and that matters.
  #
  # The arms DO come to rest after a place: 88 of 150 episodes settle at median
  # 93% of the episode and hold about 1.5 s. But teleop jitter wobbles a parked
  # arm a hundredth of a radian between frames, which at 30 fps reads as
  # 0.3 rad/s -- so a speed threshold fired on a dip during the return rather
  # than at the stop. Measured: it ended the phase a median 1.9 s early, p95
  # 7.5 s, in 75 of the 88 episodes that reach a rest. On hardware that looked
  # like the arm stopping midway, which is how it was found.
  #
  # AND `envelope: placed`, which is the other half. Stillness alone says the
  # arm stopped; it does not say WHERE. Both arms end a place at a tight,
  # repeatable pose -- across the 52 late episodes the standard deviation is
  # 0.01 rad on left joint2 and 0.01 on right joint4 -- so that pose is a
  # target, and `placed` is it.
  #
  # The envelope alone is not enough either: the arm passes through the region
  # on its way in, so it fires at 77% of an episode. Arrived AND stopped fires
  # in 44 of the 52 late episodes, at median 90%.
  #
  # `on_fail: continue` because the tighter condition fires in fewer episodes
  # (73/150 in replay) and the park step below is the backstop: a timeout here
  # means the arms are parked deliberately instead, not that the run failed.
  - step: run_policy
    policy: place_and_scan
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed, settled: true, still_spread: 0.06, hold_s: 1.0}
    on_fail: continue
    #
    # WITH THE SCANNER, this becomes the strongest check in the mission --
    # add `signal: scanned` to the line above and uncomment the signals block
    # at the top:
    #
    #   until: {timeout_s: 150.0, signal: scanned,
    #           grasp: open, side: right, settled: true, hold_s: 0.5}
    #
    # Read as: the scanner identified the item (so the handover worked and it
    # was presented correctly) AND the right gripper then released it AND the
    # arms came to rest. Conditions are ANDed, so the scan is not a shortcut
    # past the release -- an item that was scanned and then dropped on the
    # floor still fails.

  # Confirm both hands are empty. This is the check that says the object went
  # in the box rather than onto the floor.
  - {step: check_arms, envelope: travel, seconds: 5.0}

  # Bring the arms back to rest.
  #
  # THE POLICY CANNOT DO THIS. Measured against all 150 place episodes: the
  # phase ends 0.656 rad from rest at its worst joint, and the episode's own
  # last frame is 0.656 rad out too -- the condition fires exactly where the
  # demonstration stops. Recording ended while the demonstrator was still
  # bringing the arms back, so the return is not in the data and the policy was
  # never shown it.
  #
  # So the orchestrator does it: a joint-space ramp to the measured rest pose,
  # deterministic, no policy involved.
  #
  # GATED BY enable_park, which is FALSE by default -- this step reports success
  # without moving until you turn it on. Do that only when you are ready to
  # watch the first park: the ramp has never run on this hardware, it moves both
  # arms at max_joint_speed (0.15 rad/s), and it is the one thing in this
  # mission the orchestrator commands itself.
  #
  #     ros2 launch ... mission:=pick_then_place use_nav2:=false enable_park:=true
  - {step: park_arms, profile: home}
  - {step: check_arms, envelope: home, seconds: 5.0}

repeat: 1
