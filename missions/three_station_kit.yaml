# The whole kit: three items, three totes, one box.
#
#   position 1  pick the lipstick  ->  place it
#   38 cm left  ->  position 2  ->  pick the oil
#   38 cm right ->  position 1  ->  place it
#   76 cm left  ->  position 3  ->  pick the tissue
#   76 cm right ->  position 1  ->  place it
#
# two_item_kit (which ran on hardware 2026-09-28) plus the tissue. Built the
# same way: NO PARK -- the place demonstrations bring the arms down themselves,
# so every arm motion here is a policy's -- and between phases the orchestrator
# only CHECKS, with `check_arms` before every drive.
#
# LENIENT, ON PURPOSE (2026-09-28, for the first full run): nothing stops the
# mission except a base move that fails twice. Every check_arms and every pick
# is `on_fail: continue` -- a failure is logged in the summary and the mission
# goes on. THE OPERATOR IS THE STOP: keep a hand on the e-stop. That includes
# the case the checks exist for: a pick that failed or dropped its object, or
# arms outside the drive envelope, will now be driven with instead of aborting.
# Tighten back to `on_fail: abort` on the checks before drives once one full
# cycle has been seen.
#
# Every place happens at position 1, where tote 1, the scanner and the box are,
# and each pick at its own tote's position -- exactly how the demonstrations
# were recorded (lipstick at spot 1, oil at spot 2, tissue at spot 3, every
# place at spot 1). So the robot always drives home before placing.
#
# ASSUMED LAYOUT -- confirm before the first run: one straight row, each tote
# 38 cm further LEFT than the last, so position 3 is 76 cm left of position 1.
# If tote 3 is somewhere else, change position_3 below; the move distances all
# follow from it.
#
# Run it with prompt switching (one client for the mission; see
# docs/POLICY_SWITCHING.md) or without:
#
#     ros2 launch cerebel_orchestrator orchestrator.launch.py \
#         mission:=three_station_kit use_nav2:=false \
#         policy_switching:=prompt prompt_handover:=blend
#
# Only the lipstick's pick -> place is a policy-to-policy switch, so that is
# the only one blend or pause changes. Every other pick and place is followed
# by a check or a drive, and the client is paused (and must acknowledge it)
# before those.
#
# BEFORE RUNNING:
#   1. The chassis bring-up must be up
#      (`ros2 launch chassis_control svtrobo_bringup.launch.py`):
#      `/svtrobot_cmd` with a non-adapter subscriber, `/all_wheel_rpm` publishing.
#   2. Lipstick in tote 1, oil in tote 2, tissue in tote 3, placed as in the
#      demonstrations. Box empty. Clear floor from position 1 to position 3.
#   3. The robot standing at position 1. Nothing measures where it is: the
#      axis is anchored by assertion (`start_position`), and every move is
#      dead reckoning from there.

name: three_station_kit
frame_id: odom

positions:
  position_1: {axis_cm: 0.0}     # tote 1 (lipstick) + scanner + box
  position_2: {axis_cm: 38.0}    # tote 2 (oil), 38 cm to the LEFT
  position_3: {axis_cm: 76.0}    # tote 3 (tissue), 76 cm to the LEFT -- ASSUMED, see above

start_position: position_1

# One checkpoint, four prompts, identical client parameters -- which is what
# lets `policy_switching: prompt` run them all on one client. The strings are
# the dataset's four annotations, verbatim.
policies:
  pick_lipstick:
    task_description: "pick up the lipstick"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: &policy_params
      # RTC configuration (round trip p50 239 ms / p95 273 ms; chunk length
      # 40; frozen <= overlap <= prefetch_lead). Same in every mission.
      # 2026-10-08: horizon 40, lead 19. With the whole 40-step chunk queued,
      # each chunk runs (40 - prefetch_lead) = 21 steps before the next one
      # replaces it: ~1 frozen + 4 ramp + 16 freshly planned at the measured
      # 9-tick round trip (18 fresh if replies are slower). Simulated in
      # tests/test_client_node_loop.py's harness. A LARGER lead fires the next
      # request earlier and runs FEWER steps (lead 26 -> 9 fresh). Keep
      # frozen <= overlap <= prefetch_lead.
      execution_horizon: 40
      prefetch_enable: true
      rtc_enable: true
      prefetch_lead: 19
      rtc_overlap_steps: 14
      rtc_frozen_steps: 10
      rtc_ramp_rate: 5.0
      enable_limits: false
      # Both arms enabled even though only the left one picks: the place begins
      # with a handover, from wherever the pick left the right arm.
      enable_right_arm: true
      enable_right_gripper: true

  pick_oil:
    task_description: "pick up the oil"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: *policy_params

  pick_tissue:
    task_description: "pick up the tissue"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: *policy_params

  place_and_scan:
    task_description: "scan and place the object"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: *policy_params

steps:
  # ---------------- item 1: the lipstick, at position 1 --------------------
  # MEASURED, 50 lipstick episodes: p95 19.2 s -> 30 s cap. Ends when the object
  # is held AND the arm has lifted it clear (the gripper alone fires at 44% of
  # a lipstick episode, arm still in the tote).
  - step: run_policy
    policy: pick_lipstick
    until: {timeout_s: 30.0, grasp: closed, side: left, envelope: carry, hold_s: 0.5}
    on_fail: continue

  # MEASURED, 150 place episodes: p95 26.4 s -> 55 s cap. Ends when the right
  # gripper opens after the handover AND both arms are inside the pose a place
  # ends at AND they have stopped. On hardware: 16.9-21.7 s.
  - step: run_policy
    policy: place_and_scan
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed, settled: true, still_spread: 0.06, hold_s: 1.0}
    on_fail: continue

  # Both hands empty and the arms where a place leaves them, before the drive.
  # Lenient: logged, never stops the run (see the header).
  - {step: check_arms, envelope: travel, seconds: 8.0, on_fail: continue}

  # ---------------- item 2: the oil, at position 2 -------------------------
  - {step: move_base, to: position_2, on_fail: retry, retries: 1}

  # MEASURED, 50 oil episodes: p95 11.4 s -> 25 s cap. On hardware: 9.5 s.
  - step: run_policy
    policy: pick_oil
    until: {timeout_s: 25.0, grasp: closed, side: left, envelope: carry, hold_s: 0.5}
    # Nothing between this pick and the drive home: the object stays in the
    # gripper, and check_arms reports whether it is still held and the arm is
    # tucked enough to drive (reports only -- lenient).
    ends_parked: true
    on_fail: continue
  - {step: check_arms, envelope: carry, seconds: 5.0, on_fail: continue}

  - {step: move_base, to: position_1, on_fail: retry, retries: 1}

  - step: run_policy
    policy: place_and_scan
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed, settled: true, still_spread: 0.06, hold_s: 1.0}
    on_fail: continue
  - {step: check_arms, envelope: travel, seconds: 8.0, on_fail: continue}

  # ---------------- item 3: the tissue, at position 3 ----------------------
  # One drive of 76 cm. Dead reckoning, so its error is about twice a 38 cm
  # move's -- the two 38 cm moves on hardware each read 38.1 cm on the wheels.
  - {step: move_base, to: position_3, on_fail: retry, retries: 1}

  # 30 s cap, the tissue figure from this file's earlier measurement (p95 x2),
  # not re-measured since. `carry` and `grasp_close_m` WERE measured over all
  # 152 pick episodes, tissue's 52 included, and fire in 152 of 152 on replay.
  # This is the first tissue pick the orchestrator has run.
  - step: run_policy
    policy: pick_tissue
    until: {timeout_s: 30.0, grasp: closed, side: left, envelope: carry, hold_s: 0.5}
    ends_parked: true
    on_fail: continue
  - {step: check_arms, envelope: carry, seconds: 5.0, on_fail: continue}

  - {step: move_base, to: position_1, on_fail: retry, retries: 1}

  - step: run_policy
    policy: place_and_scan
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed, settled: true, still_spread: 0.06, hold_s: 1.0}
    on_fail: continue

  # Kit complete: both hands empty, the tissue in the box, not on the floor.
  - {step: check_arms, envelope: travel, seconds: 8.0, on_fail: continue}

# One kit per run. Before raising it: nothing corrects the base's position
# between cycles, and a second cycle's first pick would start from where the
# last place ended rather than from rest.
repeat: 1
