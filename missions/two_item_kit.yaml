# Two items, one base move each way. The next increment after pick_then_place.
#
#   position 1  pick the lipstick  ->  place it
#   38 cm left  ->  position 2  ->  pick the oil
#   38 cm right ->  position 1  ->  place it
#
# Three prompts of one checkpoint, two base moves, and NO PARK. The orchestrator
# never commands the arms: the place demonstrations bring the arms back down
# themselves, so every arm motion in this mission is a policy's. Between phases
# the orchestrator only CHECKS -- `check_arms` before each drive, which aborts
# rather than moving the base with the arms somewhere unexpected.
#
# RAN ON HARDWARE 2026-09-28, with no park (enable_park was false): both drives
# measured 38.1 cm on the wheels, and the oil pick started from where the first
# place ended and completed in 9.5 s.
#
#     ros2 launch cerebel_orchestrator orchestrator.launch.py \
#         mission:=two_item_kit use_nav2:=false
#
# BEFORE RUNNING:
#   1. `move_only` must have worked. Movement first, alone.
#   2. The chassis bring-up must be up
#      (`ros2 launch chassis_control svtrobo_bringup.launch.py`):
#      `/svtrobot_cmd` with a non-adapter subscriber, and `/all_wheel_rpm`
#      publishing.
#   3. Lipstick in tote 1, oil in tote 2. Clear floor between the positions.

name: two_item_kit
frame_id: odom

positions:
  position_1: {axis_cm: 0.0}     # tote 1 (lipstick) + scanner + box
  position_2: {axis_cm: 38.0}    # tote 2 (oil), 38 cm to the LEFT

start_position: position_1

policies:
  pick_lipstick:
    task_description: "pick up the lipstick"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: &policy_params
      # 2026-10-08: horizon 40, lead 19. With the whole 40-step chunk queued,
      # each chunk runs (40 - prefetch_lead) = 21 steps before the next one
      # replaces it: ~1 frozen + 4 ramp + 16 freshly planned at the measured
      # 9-tick round trip (18 fresh if replies are slower). Simulated in
      # tests/test_client_node_loop.py's harness. A LARGER lead fires the next
      # request earlier and runs FEWER steps (lead 26 -> 9 fresh). Keep
      # frozen <= overlap <= prefetch_lead.
      execution_horizon: 40
      prefetch_enable: true
      rtc_enable: true
      prefetch_lead: 19
      rtc_overlap_steps: 14
      rtc_frozen_steps: 10
      rtc_ramp_rate: 2.0    # 2026-10-08: softer handover; ramp weights 0.38 0.64 0.81 0.92 (5.0 was 0.64 0.87 0.96 0.99)
      enable_limits: false
      enable_right_arm: true
      enable_right_gripper: true

  pick_oil:
    task_description: "pick up the oil"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: *policy_params

  place_and_scan:
    task_description: "scan and place the object"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_scan_place"
    params: *policy_params

steps:
  # ---------------- item 1: the lipstick, at position 1 --------------------
  # MEASURED, 50 lipstick episodes: p95 19.2 s -> 30 s cap. Ends when the object
  # is held AND the arm has lifted it clear; see pick_then_place for why the
  # gripper alone fires at 44% of an episode.
  - step: run_policy
    policy: pick_lipstick
    until: {timeout_s: 30.0, grasp: closed, side: left, envelope: carry, hold_s: 0.5}
    on_fail: abort

  # MEASURED, 150 place episodes: p95 26.4 s -> 55 s cap. Ends when the right
  # gripper opens after the handover AND both arms are inside the pose a place
  # ends at AND they have stopped.
  - step: run_policy
    policy: place_and_scan
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed, settled: true, still_spread: 0.06, hold_s: 1.0}
    on_fail: continue

  # No park: the place policy brings the arms down itself. Before the base
  # moves, confirm both hands are empty and the arms are where a place leaves
  # them -- `on_fail: continue` above means a place that timed out still
  # reaches this line, and this is what stops the drive if it went wrong.
  - {step: check_arms, envelope: travel, seconds: 8.0, on_fail: abort}

  # ---------------- 38 cm left, to tote 2 ---------------------------------
  - {step: move_base, to: position_2, on_fail: retry, retries: 1}

  # ---------------- item 2: the oil, at position 2 -------------------------
  # MEASURED, 50 oil episodes: p95 11.4 s -> 25 s cap. Shorter than the
  # lipstick's because the oil bottle is a shorter reach.
  - step: run_policy
    policy: pick_oil
    until: {timeout_s: 25.0, grasp: closed, side: left, envelope: carry, hold_s: 0.5}
    # Nothing between this pick and the drive home. `ends_parked` is the claim that the pick finishes somewhere
    # drive-safe, and check_arms is what measures whether it did, including
    # whether the object is still held.
    ends_parked: true
    on_fail: abort
  - {step: check_arms, envelope: carry, seconds: 5.0, on_fail: abort}

  # ---------------- 38 cm right, carrying the oil -------------------------
  - {step: move_base, to: position_1, on_fail: retry, retries: 1}

  # ---------------- place item 2 ------------------------------------------
  - step: run_policy
    policy: place_and_scan
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed, settled: true, still_spread: 0.06, hold_s: 1.0}
    on_fail: continue

  # Both hands empty: the oil went in the box, not on the floor.
  - {step: check_arms, envelope: travel, seconds: 8.0}

repeat: 1
