# =============================================================================
# DO NOT RUN THIS AGAINST THE pick_scan_place CHECKPOINT.
#
# This mission is from the earlier green-cube task. Its task_description is
# "pick up the green cube and place it in the box", which is NOT one of the four
# annotations in 20260923_pick_and_scan_and_place_01 -- so that checkpoint has
# never been conditioned on this string and what it would do is undefined, not
# "a pick".
#
# It is kept because it is the worked example of a pick-and-carry mission with
# Nav2 base motion. For the current task use pick_then_place or
# three_station_kit, whose prompts are verified against meta/tasks.jsonl.
# =============================================================================

# Autonomous pick-and-place across two stations, one base move apart.
#
# The shape of the task:
#
#   arms hanging down  ->  drive to the pick station  ->  the pick policy picks
#   the object and comes to rest holding it in its carry pose  ->  verify that
#   pose  ->  drive to the place station WITH THE OBJECT IN HAND  ->  the place
#   policy puts it down  ->  tuck both arms back to the normal base pose.
#
# **There is deliberately no park between the pick and the drive.** The policy's
# own final pose is the travel pose -- ramping the arms to a parked pose there
# would drop the object. That is what `ends_parked: true` declares, and what the
# `check_arms` step immediately after it verifies.
#
# Numbers to replace before running:
#   * station x/y/yaw       -- metres and radians in the `frame_id` frame, which
#                              with the no-SLAM configuration is `odom`, i.e.
#                              measured from wherever the base was powered on
#   * task_description      -- must match the training annotation VERBATIM
#   * server_host/port      -- the GPU box, or 127.0.0.1 through an SSH forward
#   * timeout_s             -- generous enough for a slow attempt, short enough
#                              that a failed one does not sit there for minutes
#   * the `carry` envelope in params/arm_envelopes.yaml -- placeholders until
#                              measured from a few real picks

name: two_station_pick_place
frame_id: odom

stations:
  # With odometry-only localisation, (0, 0, 0) is by definition where the wheels
  # were when the chassis driver came up.
  home:  {x: 0.0, y:  0.0, yaw: 0.0}
  pick:  {x: 0.0, y:  0.45, yaw: 0.0}
  place: {x: 0.0, y: -0.45, yaw: 0.0}

policies:
  # ONE checkpoint, two prompts. Both entries point at the same
  # server_host:server_port, which is the local end of the SSH forward to cthor;
  # the orchestrator prints the grouping at startup so this is visible before
  # anything moves.
  #
  # BEFORE TRUSTING TWO DIFFERENT PROMPTS: check what the checkpoint was
  # fine-tuned on.
  #
  #     wc -l <dataset>/meta/tasks.jsonl
  #
  # If that is one line, the policy only ever saw one annotation, and a second
  # prompt here is a string it has never been conditioned on -- the behaviour
  # you get is undefined, not "the place half of the task". In that case set
  # both task_descriptions to that one annotation, verbatim, and let the two
  # phases differ by their `until` conditions instead: the pick phase ends on
  # grasp:closed, the place phase on grasp:open. Same policy, same prompt, two
  # differently-terminated runs.
  #
  # Distinct prompts start earning their keep once the dataset has distinct
  # annotations per segment, which is a data-collection change, not a config one.
  pick_cube:
    task_description: "pick up the green cube and place it in the box"
    server_host: 127.0.0.1
    server_port: 5555
    checkpoint_label: "adibot-green-pick"
    params:
      execution_horizon: 16
      prefetch_enable: true
      rtc_enable: false
      # Limits off matches the validated configuration in adibot_gr00t_client
      # docs/VALIDATION.md; turn them on with a limits_file extracted from the
      # dataset once the task is reliable.
      enable_limits: false
      enable_right_arm: false
      enable_right_gripper: false

  place_cube:
    # Same string as pick_cube on purpose -- see the note above. Change it only
    # once the checkpoint has been trained on a separate place annotation, and
    # then it must match that annotation verbatim.
    task_description: "pick up the green cube and place it in the box"
    server_host: 127.0.0.1
    server_port: 5555
    checkpoint_label: "adibot-green-pick"
    params:
      execution_horizon: 16
      prefetch_enable: true
      rtc_enable: false
      enable_limits: false
      enable_right_arm: false
      enable_right_gripper: false

steps:
  # Start from the normal base pose, arms hanging down. The mission cannot know
  # what the arms were doing before it began, and step 1 moves the base.
  - {step: park_arms, profile: home}

  - {step: navigate, station: pick, on_fail: retry, retries: 2}

  # Put the arms where the training episodes began, so the policy's first
  # observation is in distribution -- and so the gripper is open, which is what
  # arms the `grasp: closed` condition below. Drop this step if `home` already
  # is the pose the episodes start from.
  - {step: park_arms, profile: ready}

  # The pick ends when the gripper is closed on the object AND the arm has
  # stopped moving -- i.e. the policy has finished and is holding its carry
  # pose. Both conditions, not the first one to fire: a grasp registered
  # mid-reach would send the base off while the arm was still swinging.
  #
  # on_fail is `abort`, not `retry`, on purpose. A retry re-runs only this step,
  # starting from wherever the failed attempt ended -- and if that left the
  # gripper closed, the `grasp: closed` condition can never arm and the retry is
  # guaranteed to time out. Retry a failed pick by re-running the mission.
  - step: run_policy
    policy: pick_cube
    until: {timeout_s: 90.0, grasp: closed, side: left, settled: true, hold_s: 0.5}
    ends_parked: true
    on_fail: abort

  # Verify the claim `ends_parked` makes. If the policy finished somewhere other
  # than its carry pose -- or dropped the object -- the mission stops here,
  # before the wheels turn.
  - {step: check_arms, envelope: carry, seconds: 5.0}

  - {step: navigate, station: place, on_fail: retry, retries: 2}

  # The place ends when the gripper opens again and the arm settles.
  - step: run_policy
    policy: place_cube
    until: {timeout_s: 90.0, grasp: open, side: left, settled: true, hold_s: 0.5}
    on_fail: abort

  # Tuck both arms back to the normal base pose, hands hanging down.
  #
  # If the place policy is trained to return to that pose by itself, delete this
  # step and mark the policy `ends_parked: true` instead -- the mission then ends
  # with the arms wherever the policy put them, and the check below is what
  # confirms that is where you wanted them.
  - {step: park_arms, profile: home}
  - {step: check_arms, envelope: home, seconds: 5.0}

  # To drive back to the start afterwards, add:
  #   - {step: navigate, station: home, on_fail: continue}

repeat: 1
