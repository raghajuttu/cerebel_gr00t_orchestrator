# One object, the atomic way, at position 1. The base never moves.
#
#   pick up the lipstick  ->  transfer the lipstick  ->  place the lipstick
#
# For the ATOMIC checkpoint trained on 20261010_pick_and_place_02, whose nine
# tasks split the old "scan and place the object" into a transfer (left hand to
# right hand) and a place (scan, then into the box). Run this before
# atomic_kit: it exercises every new phase boundary without the base.
#
#     ros2 launch cerebel_orchestrator orchestrator.launch.py \
#         mission:=atomic_kit_one use_nav2:=false
#
# Prompt switching with a PAUSE between phases is set below, so no launch
# arguments are needed for it: one client for the mission, each phase starts
# from rest. (Blend broke the handover on the previous checkpoint.)
#
# LENIENT, ON PURPOSE: every phase and check is `on_fail: continue` -- a
# failure is logged in the summary and the mission goes on. The operator is the
# stop.
#
# MEASURED 2026-10-12 on data/3 (the transfer and place half of the atomic
# dataset, 300 episodes), by replaying every episode through the orchestrator's
# own PhaseMonitor: the transfer condition fires in 149/150, the place
# condition in 147/150 (see carry_atomic, handed_over and placed_atomic in
# params/arm_envelopes.yaml). The PICK episodes are not in data/3: the pick
# still ends on the finger thresholds of the previous dataset, with an envelope
# widened to where the new transfers begin.
#
# BEFORE RUNNING: lipstick in tote 1, box empty, robot at position 1, arms at
# rest.

name: atomic_kit_one
frame_id: odom

policy_switching: prompt
prompt_blend: false

policies:
  pick_lipstick:
    task_description: "pick up the lipstick"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_and_place_02"   # label only, for the run logs
    params: &policy_params
      # The RTC settings in use on the robot: run D_7 of experiments/04_09_2026
      # (see the note in three_station_kit.yaml).
      execution_horizon: 40
      prefetch_enable: true
      rtc_enable: true
      prefetch_lead: 20
      rtc_overlap_steps: 14
      rtc_frozen_steps: 10
      rtc_ramp_rate: 5.0
      enable_limits: false
      enable_right_arm: true
      enable_right_gripper: true

  transfer_lipstick:
    task_description: "transfer the lipstick"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_and_place_02"
    params: *policy_params

  place_lipstick:
    task_description: "place the lipstick"
    server_host: 192.168.8.153
    server_port: 5555
    checkpoint_label: "pick_and_place_02"
    params: *policy_params

steps:
  # GO TO READY, once, before the first pick: a slow, smooth move (minimum-jerk,
  # peak max_joint_speed, ~5 s from the bring-up pose) to where the pick
  # demonstrations begin, grippers opened at the end. `enable: true` moves the
  # arms for this step even though enable_park stays false for every other
  # mission. on_fail: continue -- if it cannot run, the pick starts from
  # wherever the arms are, as it did before.
  - {step: park_arms, profile: ready_atomic, enable: true, on_fail: continue}

  # PICK: ends when the object is held AND the arm is in the carry pose
  # (carry_atomic, widened 2026-10-13). 40 s cap, only a guard -- the phase ends
  # as soon as the conditions hold. min_finger 0.005: an empty close reads
  # 0.0006-0.0017 m, a held lipstick never below 0.0085.
  - step: run_policy
    policy: pick_lipstick
    until: {timeout_s: 40.0, grasp: closed, side: left, envelope: carry_atomic, min_finger: 0.005, hold_s: 0.5}
    on_fail: continue

  # TRANSFER: ends when the RIGHT gripper has closed on the object AND the LEFT
  # one has let go (envelope `handed_over`). The right gripper starts open, so
  # `grasp: closed` arms at once. MEASURED: transfer the lipstick p95 15.5 s ->
  # 40 s cap; fires in 50/50 lipstick transfers, median 63% of the episode.
  - step: run_policy
    policy: transfer_lipstick
    until: {timeout_s: 40.0, grasp: closed, side: right, envelope: handed_over, min_finger: 0.005, hold_s: 0.5}
    on_fail: continue

  # PLACE: scan, then into the box. Ends when the right gripper opens AND both
  # arms are in the pose a place ends at (placed_atomic) AND they have stopped
  # (under 0.10 rad over 1 s: the demonstrations end while still moving, and
  # 0.06 fired in only 123/150). The right gripper starts closed (holding the
  # object), so `grasp: open` arms at once. MEASURED: place the lipstick p95
  # 17.8 s; the 55 s cap is lenient. Fires in 49/50 lipstick places.
  - step: run_policy
    policy: place_lipstick
    until: {timeout_s: 55.0, grasp: open, side: right,
            envelope: placed_atomic, settled: true, still_spread: 0.10, hold_s: 1.0}
    on_fail: continue

  # Both hands empty and the arms where a place ends: the lipstick went in the
  # box (placed_atomic contains 150/150 place endings).
  - {step: check_arms, envelope: placed_atomic, seconds: 8.0, on_fail: continue}

repeat: 1
