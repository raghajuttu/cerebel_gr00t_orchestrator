# Joint-space envelopes the base is allowed to drive with.
#
# A `check_arms` step passes when every constrained joint is inside its bounds.
# Joints that are not listed are unconstrained -- which is the point: the carry
# pose after a pick depends on where the object was, so an envelope should pin
# the joints that decide whether the arm is tucked and leave the rest free.
#
# EVERY BOUND HERE IS A PLACEHOLDER. They are wide enough to pass on almost
# anything, which makes them useless as a safety check until you replace them.
#
# How to measure one:
#   1. Run the pick phase for real, several times, and let it end in its carry
#      pose with the object held.
#   2. For each run, read the 16-D canonical joint vector:
#        ros2 topic echo --once /joint_states     # scrambled -- reorder by name
#      or take it from the per-tick CSV the inference client wrote.
#   3. For each joint that matters -- shoulder pitch, elbow, anything that
#      decides how far the arm sticks out -- take the range across runs and add
#      a margin. That is the bound.
#   4. Leave wrist and roll joints out unless they actually change the envelope.
#
# Joint names must be canonical (see cerebel_orchestrator/joints.py):
#   openarm_{left,right}_joint1..joint7, openarm_{left,right}_finger_joint1

envelopes:
  carry:
    description: >
      Holding the object after a pick, tucked enough to drive with. This is the
      envelope that backs up `ends_parked: true` on the pick policy -- if the
      policy ended somewhere else, the mission stops here rather than driving
      off with the arm extended.
    joints:
      # MEASURED, and REPLAYED: p1..p99 of the final frame of all 152 pick
      # episodes, arm joints widened by 0.15 rad. Replaying
      # `grasp:closed AND envelope:carry, hold 0.5s` against those episodes
      # fires in 152 of 152, at median 86% of the episode.
      #
      # The earlier p2..p98 +0.10 bounds fired in only 136 -- 16 episodes sat a
      # few thousandths outside a boundary that the percentile cut had put
      # there by construction. Widen before tightening: a bound that never
      # fires costs a whole run, a bound that is slightly loose costs nothing
      # because the gripper condition is ANDed with it.
      openarm_left_joint1:         [-0.494,  0.366]
      openarm_left_joint2:         [-0.664, -0.015]
      openarm_left_joint3:         [-0.529,  0.282]
      openarm_left_joint4:         [ 1.704,  2.405]
      openarm_left_joint5:         [-0.781,  0.010]
      openarm_left_joint6:         [-0.474,  0.222]
      openarm_left_joint7:         [-0.046,  0.827]
      # The fingers are set by what they MEAN, not by a percentile. Left must
      # be closed on the object -- 0.025 is grasp_close_m, so this and the
      # grasp condition agree. Right must be open, because that hand is still
      # empty at the end of a pick; the handover comes later.
      openarm_left_finger_joint1:  [ 0.000,  0.025]
      openarm_right_joint1:        [-0.122,  0.287]
      openarm_right_joint2:        [-0.138,  0.257]
      openarm_right_joint3:        [-1.174,  0.229]
      openarm_right_joint4:        [-0.042,  0.404]
      openarm_right_joint5:        [-0.609,  0.755]
      openarm_right_joint6:        [-0.793, -0.056]
      openarm_right_joint7:        [-0.734, -0.123]
      openarm_right_finger_joint1: [ 0.035,  0.060]


  home:
    description: >
      Both arms hanging down in the normal base pose, nothing held. Checked
      after the final park so the mission ends in a state you can walk away
      from.
    joints:
      openarm_left_joint1:  [-3.14, 3.14]
      openarm_left_joint2:  [-3.14, 3.14]
      openarm_left_joint4:  [-3.14, 3.14]
      openarm_right_joint1: [-3.14, 3.14]
      openarm_right_joint2: [-3.14, 3.14]
      openarm_right_joint4: [-3.14, 3.14]

  travel:
    description: >
      Where the place policy actually leaves the arms, with both hands empty.

      NOT a tucked rest pose, despite the name. The demonstrator's intent was to
      return to rest, but recording stops while the arms are still moving, so
      the last frame catches them part-way: the left arm is close to rest, the
      right arm ends near the box -- 0.52 rad out on joint3 and 0.65 on joint5.
      These bounds describe that, because that is what a place phase will
      actually produce.

      Two consequences. As an end-of-mission check it is sound: the gripper
      bounds prove both hands are empty, which is the real question. But a
      SECOND cycle would start its pick with the right arm half a radian from
      where all 152 pick demonstrations started it -- so a repeat needs a
      `park_arms` back to `ready` between cycles, not this envelope.
    joints:
      # MEASURED: p2..p98 of the final frame of all 150 place episodes, arm
      # joints widened by 0.10 rad.
      openarm_left_joint1:         [-0.156,  0.172]
      openarm_left_joint2:         [-0.264, -0.000]
      openarm_left_joint3:         [ 0.232,  1.043]
      openarm_left_joint4:         [ 0.107,  0.457]
      openarm_left_joint5:         [-0.783, -0.061]
      openarm_left_joint6:         [-0.148,  0.378]
      openarm_left_joint7:         [-0.164,  0.275]
      # Both hands empty -- the object went in the box, not onto the floor.
      openarm_left_finger_joint1:  [ 0.045,  0.050]
      openarm_right_joint1:        [-0.111,  0.241]
      openarm_right_joint2:        [-0.051,  0.216]
      openarm_right_joint3:        [-1.046,  0.593]
      openarm_right_joint4:        [ 0.041,  0.310]
      openarm_right_joint5:        [-0.642,  0.843]
      openarm_right_joint6:        [-0.602,  0.047]
      openarm_right_joint7:        [-0.485,  0.025]
      openarm_right_finger_joint1: [ 0.045,  0.050]

  placed:
    description: >
      Where a place episode ENDS, with both hands empty -- the pose both arms
      come to rest in and pause at after the object is in the box.

      MEASURED from the final frame of the 52 late place episodes (index >= 250)
      of 20260923_pick_and_scan_and_place_01, p1..p99, arm joints widened by
      0.15 rad. Those episodes end at a tight, repeatable pose: standard
      deviation across all 51 is 0.01 rad on left joint2, 0.04 on joint4, 0.02
      on right joint2, 0.01 on right joint4. It is a real parked configuration,
      not a drift.

      It is NOT the pose a pick starts from -- the right arm rests nearer the
      box, having just released there. Measuring against the pick's start pose
      is what made this look, wrongly, like the demonstrations never settled.

      Used ANDed with `settled` on the place phase: the arm passes through this
      region on its way in, so the envelope alone fires at 77% of an episode.
      Arrived AND stopped is what ends the phase, and that fires in 44 of the
      52 late episodes at median 90%.
    joints:
      openarm_left_joint1:         [-0.196,  0.254]
      openarm_left_joint2:         [-0.298,  0.049]
      openarm_left_joint3:         [ 0.179,  1.165]
      openarm_left_joint4:         [ 0.042,  0.483]
      openarm_left_joint5:         [-0.877, -0.098]
      openarm_left_joint6:         [-0.153,  0.443]
      openarm_left_joint7:         [-0.183,  0.303]
      # Both hands empty: the object went in the box.
      openarm_left_finger_joint1:  [ 0.035,  0.060]
      openarm_right_joint1:        [-0.162,  0.284]
      openarm_right_joint2:        [-0.099,  0.267]
      openarm_right_joint3:        [-1.107, -0.147]
      openarm_right_joint4:        [ 0.011,  0.355]
      openarm_right_joint5:        [ 0.127,  0.982]
      openarm_right_joint6:        [-0.653,  0.059]
      openarm_right_joint7:        [-0.489,  0.134]
      openarm_right_finger_joint1: [ 0.035,  0.060]
