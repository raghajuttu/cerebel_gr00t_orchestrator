# Arm poses the orchestrator can ramp to.
#
# EVERY NUMBER HERE IS A PLACEHOLDER. Zero on the OpenArm is the arm straight
# out, which is the worst possible pose to drive with -- these values exist so
# the file parses, not so the robot uses them.
#
# How to fill it in, per profile:
#   1. With the arms powered and NO policy running, hand-guide or jog the arms
#      into the pose, physically.
#   2. Read it off /joint_states in canonical order:
#        ros2 topic echo --once /joint_states
#      and reorder by name -- the message is scrambled.
#   3. Paste the 7 arm values per side here; gripper values are finger positions
#      in metres, the same units the GripperCommand action takes.
#   4. Check it from several starting poses with:
#        ros2 run cerebel_orchestrator arm_park --ros-args \
#            -p enable_park:=true -p profile:=home \
#            -p park_poses_file:=<this file> -p max_joint_speed:=0.05
#      The ramp is a straight line in joint space with no collision checking, so
#      a pose is only usable if every joint can move monotonically to it from
#      anywhere the policy can leave the arm.
#
# Joint order per arm: joint1 .. joint7, base to wrist.

profiles:
  home:
    # The arms' rest pose -- where every pick episode begins and where the
    # robot should be left at the end of a run.
    #
    # THIS WAS ALL ZEROS AND THAT WAS DANGEROUS. Zero on this arm is not "hanging
    # down"; it is a different configuration entirely, and a park ramp to it
    # would have swung both arms through a large motion nobody intended. The
    # values below are the median frame-0 joint state of all 152 pick episodes
    # of 20260923_pick_and_scan_and_place_01 -- measured, and identical to
    # `ready` below, because on this robot the rest pose and the pose the
    # policies start from are the same place.
    left_arm:  [ 0.0502, -0.1230,  0.3767,  0.4108, -0.2926,  0.0113,  0.1677]
    right_arm: [ 0.0799,  0.0488, -0.0542,  0.2272, -0.1432, -0.2262, -0.4541]
    # Open, matching the demonstrations -- and an open left gripper is what
    # arms the `grasp: closed` condition of a pick that follows.
    left_gripper: 0.0483
    right_gripper: 0.0496

  ready:
    # Where the pick policy's training episodes began. Parking here before a
    # policy phase puts the arms inside the distribution the policy was trained
    # on, instead of wherever the previous phase ended. The gripper is open --
    # which also arms the `grasp: closed` condition of the phase that follows.
    #
    # NOT A PLACEHOLDER: this is the median frame-0 joint state across all 152
    # pick episodes of 20260923_pick_and_scan_and_place_01. It is literally
    # where the demonstrations start, which is exactly what this pose is for.
    left_arm:  [ 0.0502, -0.1230,  0.3767,  0.4108, -0.2926,  0.0113,  0.1677]
    right_arm: [ 0.0799,  0.0488, -0.0542,  0.2272, -0.1432, -0.2262, -0.4541]
    left_gripper: 0.0483
    right_gripper: 0.0496

  travel:
    # A tucked pose for missions that park before driving rather than carrying
    # the object in the policy's own carry pose. NOT used by the shipped
    # pick-and-carry mission: parking between the pick and the drive would drop
    # whatever the gripper is holding.
    # STILL A PLACEHOLDER, and zero is not a safe default on this arm -- see
    # the note under `home`. Nothing in pick_then_place or three_station_kit
    # uses this profile; measure a real tucked pose before any mission does.
    left_arm:  [ 0.0502, -0.1230,  0.3767,  0.4108, -0.2926,  0.0113,  0.1677]
    right_arm: [ 0.0799,  0.0488, -0.0542,  0.2272, -0.1432, -0.2262, -0.4541]
    left_gripper: 0.0483
    right_gripper: 0.0496

  placed:
    # The pose a place episode ends at -- the median final frame of the 52 late
    # place episodes (index >= 250) of 20260923_pick_and_scan_and_place_01.
    #
    # This is a FINISHING park, not a repositioning one. The place policy gets
    # the arms to within about 0.1 rad of here and then its episode ends,
    # because the demonstrations only hold still for 1.5-2 s and no stillness
    # threshold can wait longer than the data holds. Six degrees of residual is
    # not worth chasing with a threshold; it is worth one second of a ramp.
    #
    # Use this, not `home`, to finish a place. `home` is where a PICK starts,
    # 0.65 rad away on right joint5, so parking there after a place is a large
    # deliberate move -- right for starting another cycle, wrong for tidying up
    # the one that just finished.
    left_arm:  [ 0.0063, -0.1293,  0.6371,  0.2617, -0.4770,  0.1427,  0.0942]
    right_arm: [ 0.0641,  0.0990, -0.5779,  0.1848,  0.5636, -0.2991, -0.2319]
    left_gripper: 0.0478
    right_gripper: 0.0491
